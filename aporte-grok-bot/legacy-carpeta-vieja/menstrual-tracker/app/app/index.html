<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luna · Mi ciclo</title><meta name="theme-color" content="#e2557b"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<section id="lock" class="lock card fade">
  <div class="logo">🌙</div><h1>Luna</h1><p id="lockMsg">Creá un PIN para cifrar tus datos en este dispositivo.</p>
  <form id="pinForm"><input id="pin" aria-label="PIN" type="password" inputmode="numeric" minlength="4" placeholder="PIN (mín. 4)" required autocomplete="off"><button class="btn">Entrar</button></form>
  <p class="err" id="pinErr"></p><p class="small">Tus datos nunca salen del navegador. Cifrado AES-256.</p>
</section>
<main id="main" hidden>
  <header class="top"><h1>🌙 Luna</h1><button id="lockBtn" class="ghost" title="Bloquear">🔒</button></header>
  <section class="hero card fade" id="summary" aria-live="polite"></section>
  <div class="row"><button class="btn" id="todayBtn">Hoy me vino el periodo</button></div>
  <section class="card fade">
    <div class="calhead"><button class="ghost" id="prev" aria-label="Mes anterior">‹</button><h2 id="month" aria-live="polite"></h2><button class="ghost" id="next" aria-label="Mes siguiente">›</button></div>
    <div class="grid dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid" id="cal"></div>
    <div class="legend"><i class="p"></i>Periodo <i class="pp"></i>Previsto <i class="f"></i>Fértil <i class="o"></i>Ovulación</div>
  </section>
  <section class="card fade"><h2>Mis ciclos</h2><ul class="hist" id="hist"></ul></section>
  <section class="card fade"><h2>Datos</h2>
    <div class="row"><button class="btn sec" id="exp">Exportar JSON</button><label class="btn sec">Importar<input type="file" id="imp" accept=".json" hidden></label><button class="btn danger" id="wipe">Borrar todo</button></div>
    <p class="small">Predicciones orientativas, no anticonceptivas ni diagnóstico médico.</p></section>
</main>
<dialog id="dlg"><form method="dialog" id="dayForm">
  <h3 id="dlgTitle"></h3>
  <label>Flujo</label><div class="chips" data-k="flow"></div>
  <label>Síntomas</label><div class="chips multi" data-k="sym"></div>
  <label>Ánimo</label><div class="chips" data-k="mood"></div>
  <label>Notas</label><textarea id="note" rows="2"></textarea>
  <div class="row"><button class="btn sec" value="cancel">Cancelar</button><button class="btn" value="ok" id="saveDay">Guardar</button></div>
</form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="main.js"></script></body></html>
